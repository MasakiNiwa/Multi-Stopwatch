<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Multi Stopwatch">
  <!-- Maskable master: the background fills the whole square and the mark stays inside the
       80% safe circle (radius 25.6 from the centre), so any OS mask can crop it safely. -->
  <rect width="64" height="64" fill="#4a5a92"/>
  <g fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round">
    <circle cx="32" cy="36" r="12.5"/>
    <path d="M27.5 16h9"/>
    <path d="M32 16v5"/>
    <path d="M32 36v-7"/>
  </g>
</svg>
