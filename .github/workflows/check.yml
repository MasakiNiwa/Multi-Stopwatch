name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare project-path preview
        run: mkdir -p preview/Multi-Stopwatch && cp -r public/. preview/Multi-Stopwatch/
      - name: Start preview
        run: python3 -m http.server 8080 --directory preview &
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-review
          path: test-results/visual
